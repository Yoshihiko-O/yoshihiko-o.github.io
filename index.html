<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoshihiko's Website</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #1a1aff;
            --accent-light: rgba(26, 26, 255, 0.08);
            --text-primary: #0a0a0f;
            --text-secondary: #666;
            --text-muted: #aaa;
            --border: rgba(0,0,0,0.08);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: #fff;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 星フィールド */
        canvas#stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            gap: 64px;
        }

        /* ヘッダーブロック */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #solar {
            display: block;
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--text-primary);
        }
        .logo-dot {
            color: var(--accent);
        }

        .tagline {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 0.08em;
        }

        /* 区切り線 */
        .divider {
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, transparent, var(--border), transparent);
        }

        /* プロジェクトリスト */
        .projects {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .card {
            position: relative;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent-light);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .card:hover {
            border-color: rgba(26, 26, 255, 0.25);
            box-shadow: 0 2px 24px rgba(26,26,255,0.06);
        }
        .card:hover::before {
            opacity: 1;
        }
        .card-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }
        .card-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .card-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .card-arrow {
            font-size: 18px;
            color: var(--accent);
            position: relative;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .card:hover .card-arrow {
            transform: translateX(3px);
        }

        .card-badge {
            font-size: 10px;
            letter-spacing: 0.06em;
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            background: #fafafa;
            width: fit-content;
        }
        .card-badge.live {
            border-color: rgba(26,26,255,0.2);
            color: var(--accent);
            background: rgba(26,26,255,0.04);
        }

        /* coming soon カード */
        .card-dim {
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            opacity: 0.5;
        }
        .card-dim .card-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .card-dim .card-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* フッター */
        .footer {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* 座標表示 */
        .coords {
            position: fixed;
            bottom: 24px;
            right: 28px;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            z-index: 2;
        }
    </style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="page">
    <div class="header">
        <canvas id="solar" width="160" height="160"></canvas>
        <div class="logo">Yoshihiko<span class="logo-dot">'s</span> Website</div>
        <div class="tagline">Independent Developer</div>
    </div>

    <div class="divider"></div>

    <div class="projects">
        <div class="section-label">Projects</div>

        <a href="eyerecovery/" class="card">
            <div class="card-left">
                <div class="card-badge live">App — iOS</div>
                <div class="card-name">視力回復3Dトレーニング</div>
                <div class="card-desc">ランダムドットステレオグラムで視力ケア</div>
            </div>
            <div class="card-arrow">→</div>
        </a>

        <div class="card-dim">
            <div class="card-left">
                <div class="card-badge">Coming soon</div>
                <div class="card-name">LucidEngin</div>
                <div class="card-desc">準備中</div>
            </div>
            <div class="card-arrow" style="color:#ccc;">→</div>
        </div>
    </div>

    <div class="footer">&copy; 2026 Yoshihiko.inc</div>
</div>

<div class="coords" id="coords">35.6895° N&nbsp;&nbsp;139.6917° E</div>

<script>
// 太陽系モデル
(function() {
    const c = document.getElementById('solar');
    const cx = c.getContext('2d');
    const CX = 80, CY = 80;

    const planets = [
        { r: 22, size: 2.2, speed: 0.009,  color: '#aaa',        phase: 0 },
        { r: 36, size: 3.0, speed: 0.0055, color: '#1a1aff',     phase: 1.2 },
        { r: 50, size: 2.4, speed: 0.0035, color: '#888',        phase: 2.5 },
        { r: 66, size: 4.2, speed: 0.002,  color: 'rgba(26,26,255,0.45)', phase: 0.8 },
    ];

    function drawSolar(t) {
        cx.clearRect(0, 0, 160, 160);

        // 軌道リング
        for (const p of planets) {
            cx.beginPath();
            cx.arc(CX, CY, p.r, 0, Math.PI * 2);
            cx.strokeStyle = 'rgba(0,0,0,0.07)';
            cx.lineWidth = 0.8;
            cx.stroke();
        }

        // 太陽
        cx.beginPath();
        cx.arc(CX, CY, 6, 0, Math.PI * 2);
        cx.fillStyle = '#0a0a0f';
        cx.fill();

        // 太陽のグロー
        const grd = cx.createRadialGradient(CX, CY, 2, CX, CY, 14);
        grd.addColorStop(0, 'rgba(26,26,255,0.12)');
        grd.addColorStop(1, 'rgba(26,26,255,0)');
        cx.beginPath();
        cx.arc(CX, CY, 14, 0, Math.PI * 2);
        cx.fillStyle = grd;
        cx.fill();

        // 惑星
        for (const p of planets) {
            const angle = t * p.speed + p.phase;
            const px = CX + Math.cos(angle) * p.r;
            const py = CY + Math.sin(angle) * p.r;
            cx.beginPath();
            cx.arc(px, py, p.size, 0, Math.PI * 2);
            cx.fillStyle = p.color;
            cx.fill();
        }

        requestAnimationFrame(drawSolar);
    }

    requestAnimationFrame(drawSolar);
})();

// 星フィールド
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');

let W, H, stars = [];

function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

function initStars(n = 120) {
    stars = [];
    for (let i = 0; i < n; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.2 + 0.2,
            a: Math.random(),
            speed: Math.random() * 0.003 + 0.001,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
        const alpha = (Math.sin(t * s.speed + s.phase) * 0.5 + 0.5) * 0.35 + 0.05;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(26, 26, 255, ${alpha})`;
        ctx.fill();
    }
    requestAnimationFrame(draw);
}

resize();
initStars();
window.addEventListener('resize', () => { resize(); initStars(); });
requestAnimationFrame(draw);
</script>
</body>
</html>
